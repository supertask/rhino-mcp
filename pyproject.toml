[project]
name = "rhino-mcp"
version = "0.1.0"
description = "Rhino integration through the Model Context Protocol"
readme = "README.md"
# Upper bound: on a new PC uv otherwise picks the newest Python, for which some
# dependencies have no prebuilt wheels yet (building them needs MSVC on Windows).
# .python-version pins uv to 3.12.
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Rhino MCP Team"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # server.py imports mcp.server.fastmcp, which fails with mcp 2.x.
    # uv.lock is not committed, so a fresh install would otherwise pick 2.x.
    "mcp[cli]>=1.3.0,<2",
    "uvicorn>=0.15.0",
    "fastapi>=0.68.0",
    "python-json-logger>=2.0.0",
    "pydantic>=1.8.0",
    "typing-extensions>=4.0.0",
    "requests",
    "pillow",
]

[project.scripts]
rhino-mcp = "rhino_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"} 